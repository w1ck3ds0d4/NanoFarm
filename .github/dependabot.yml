version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    groups:
      github-actions-patch:
        update-types: ["patch"]
      github-actions-updates:
        update-types: ["minor", "major"]
    open-pull-requests-limit: 5
    labels:
      - "ci"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    groups:
      npm-patch:
        update-types: ["patch"]
      npm-updates:
        update-types: ["minor", "major"]
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
